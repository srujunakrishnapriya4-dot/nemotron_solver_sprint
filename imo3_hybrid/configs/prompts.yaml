prompts:
  version: v2
  style: structured_runtime
  default_language: en
  strict_json_suffix: "Return valid JSON only. Do not include markdown fences or extra commentary."
  final_answer_suffix: "End with the final answer only in the required field or final-answer line."

  runtime_profiles:
    minimal_default:
      description: "Competition-minimal prompt contract for low-risk parallel attempts."
      system_prompt: |
        Solve the following math problem step by step.
        Use Python code for calculations, verification, or brute-force search.
        The answer is a non-negative integer in [0, 99999].
        Put your final answer in \boxed{}.
      tool_prompt: |
        Execute Python code in a stateful Jupyter notebook. Available: math, numpy, sympy, itertools, collections, mpmath (64-digit precision). Use print() to see results. When you need Python, emit exactly <python_tool>...</python_tool> containing only the code, then stop.
      preference_prompt: |
        Use sympy for exact symbolic computation. For number theory: use sympy.ntheory (factorint, divisors, totient, isprime). Verify analytical solutions with numerical checks or brute-force when feasible.

  fragments:
    system:
      math_solver_core: |
        You are a disciplined olympiad-math reasoning assistant.
        Prefer concise, checkable steps over long prose.
        Preserve constraints, domains, and integrality assumptions.
        Do not fabricate facts not supported by the problem statement or derived steps.
      symbolic_verification_bias: |
        When possible, make algebraic, arithmetic, modular, or combinatorial claims explicit enough to verify.
      no_markdown_json: |
        Output plain JSON only.
      final_integer_bias: |
        The target setting expects a final integer answer when the problem requires one.
        Do not output multiple candidate answers.
      local_repair_bias: |
        Preserve valid prior work.
        Change only the smallest broken substep or missing case needed to repair the solution.
      retrieval_usage_bias: |
        Use the retrieved example only as a strategy hint.
        Do not copy its content blindly.
      critique_bias: |
        Look for hidden assumptions, missing cases, invalid algebra, and contradiction with the original constraints.

    reasoning:
      smdp_phases: |
        Follow this structure:
        PHASE 1 - Understand:
        - Rewrite the problem briefly in your own words.
        - List knowns, unknowns, and domain restrictions.

        PHASE 2 - Identify Structure:
        - State the likely problem type and useful archetypes.
        - Identify key symmetries, invariants, parity/modular cues, or counting structure if present.

        PHASE 3 - Construct Solution:
        - Solve step by step.
        - Justify each nontrivial move.
        - Prefer explicit intermediate expressions.

        PHASE 4 - Verify:
        - Check the result against the original constraints.
        - Check missing cases or edge conditions.
        - State the final answer at the end only.
      step_format_compact: |
        Use short numbered steps.
      answer_line_only: |
        Final answer: <answer>

    output_schemas:
      parser_json: |
        {
          "problem_id": "string or null",
          "answer_type": "integer|expression|count|construct|unknown",
          "target_mode": "find|find_all|count|maximize|minimize|prove|unknown",
          "problem_type_seed": {
            "algebra": 0.0,
            "number_theory": 0.0,
            "geometry": 0.0,
            "combinatorics": 0.0,
            "mixed": 0.0
          },
          "knowns": [],
          "unknowns": [],
          "constraints": [],
          "domains": [],
          "archetype_cues": [],
          "symmetries": [],
          "invariants": [],
          "entity_inventory": [],
          "parse_notes": []
        }
      verifier_json: |
        {
          "logical_consistency": 0.0,
          "symbolic_consistency": 0.0,
          "completeness": 0.0,
          "answer_plausibility": 0.0,
          "repairability": 0.0,
          "failure_modes": [],
          "brief_rationale": "string",
          "recommended_action": "accept|repair|resample|reject"
        }
      critique_json: |
        {
          "has_error": true,
          "error_types": [],
          "missing_cases": [],
          "corrected_answer": "string or null",
          "critique_summary": "string"
        }
      answer_json: |
        {
          "final_answer": "string",
          "confidence_note": "string"
        }

  parser:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.no_markdown_json}}
    tasks:
      primary_extract:
        description: "Primary structured parser for online/offline problem normalization."
        user: |
          Extract a compact structured representation of the following olympiad-style problem.

          Requirements:
          - identify variables, constants, domains, equalities/inequalities, divisibility/congruence cues, and answer type
          - include likely problem-type seed and archetype cues
          - include symmetry, invariant, geometry, or combinatorics entities when clearly present
          - do not solve the problem
          - if uncertain, keep fields conservative and use parse_notes

          Problem:
          {{problem_text}}

          Schema:
          {{fragments.output_schemas.parser_json}}

          {{strict_json_suffix}}
      fallback_extract:
        description: "Conservative fallback parser for degraded runtime."
        user: |
          Extract only what is explicit or safely inferable.

          Problem:
          {{problem_text}}

          Minimum required fields:
          - answer_type
          - target_mode
          - knowns
          - unknowns
          - constraints
          - domains
          - archetype_cues
          - parse_notes

          Schema:
          {{fragments.output_schemas.parser_json}}

          {{strict_json_suffix}}
      strict_answer_type:
        description: "Small parser subprompt for answer-type projection."
        user: |
          Determine the answer type and target mode for the problem below.

          Problem:
          {{problem_text}}

          Return JSON:
          {
            "answer_type": "integer|expression|count|construct|unknown",
            "target_mode": "find|find_all|count|maximize|minimize|prove|unknown"
          }

          {{strict_json_suffix}}

  solver:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.symbolic_verification_bias}}
      {{fragments.system.final_integer_bias}}
    tasks:
      primary_smdp:
        description: "Default structured solve prompt."
        user: |
          Solve the following olympiad-style problem.

          Problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          Route summary:
          {{route_summary}}

          Optional retrieval hints:
          {{retrieval_hints}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.step_format_compact}}
          {{fragments.reasoning.answer_line_only}}
      worker_algebra:
        description: "Route-aware algebra worker."
        user: |
          Solve this problem with an algebra-first approach.
          Prefer substitutions, identities, inequalities, factorization, and canonical simplifications when justified.

          Problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}
      worker_number_theory:
        description: "Route-aware number theory worker."
        user: |
          Solve this problem with a number-theory-first approach.
          Prefer divisibility, congruences, parity, valuations, and finite-case elimination when justified.

          Problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}
      worker_geometry:
        description: "Route-aware geometry worker."
        user: |
          Solve this problem with a geometry-first approach.
          Prefer angle chasing, similarity, coordinates, transformations, or symmetry only when useful.

          Problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}
      worker_combinatorics:
        description: "Route-aware combinatorics worker."
        user: |
          Solve this problem with a combinatorics-first approach.
          Prefer invariants, extremal arguments, counting, bijections, recurrences, or pigeonhole reasoning when justified.

          Problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}
      worker_code_first:
        description: "Code/tool-biased worker for small search spaces or explicit validation."
        user: |
          Solve the problem with explicit checkability in mind.
          If a small finite search, modular check, or symbolic derivation would help, make the reasoning tool-friendly.

          Problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}
      worker_minimal:
        description: "Short-form worker for diversity."
        user: |
          Give a compact but rigorous solution attempt.
          Keep steps short and direct.
          Still verify the answer before ending.

          Problem:
          {{problem_text}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}

  retrieval:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.retrieval_usage_bias}}
    tasks:
      trace_conditioned_solve:
        description: "Top-1 example-conditioned solve prompt."
        user: |
          Example problem:
          {{retrieved_problem}}

          Example solution:
          {{retrieved_solution}}

          Use the example only as a strategy hint.

          Now solve the following new problem:
          {{problem_text}}

          Parsed state summary:
          {{parsed_summary}}

          {{fragments.reasoning.smdp_phases}}
          {{fragments.reasoning.answer_line_only}}
      trace_conditioned_compact:
        description: "Compact trace-conditioned variant."
        user: |
          Retrieved strategy hint:
          {{retrieved_hint}}

          New problem:
          {{problem_text}}

          Apply a similar strategy only if it is compatible with the new problem.
          Keep the reasoning concise and verifiable.
          End with:
          {{fragments.reasoning.answer_line_only}}

  verifier:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.no_markdown_json}}
      {{fragments.system.critique_bias}}
    tasks:
      branch_judge:
        description: "Primary structured verifier for solution branches."
        user: |
          Judge the candidate solution.

          Problem:
          {{problem_text}}

          Candidate reasoning:
          {{candidate_reasoning}}

          Candidate answer:
          {{candidate_answer}}

          Score:
          - logical consistency
          - symbolic consistency
          - completeness
          - answer plausibility
          - repairability

          Identify specific failure modes if present.
          Do not solve from scratch unless required to explain a failure.

          Schema:
          {{fragments.output_schemas.verifier_json}}

          {{strict_json_suffix}}
      strict_accept_reject:
        description: "Minimal strict verifier for late-stage gating."
        user: |
          Problem:
          {{problem_text}}

          Candidate reasoning:
          {{candidate_reasoning}}

          Candidate answer:
          {{candidate_answer}}

          Return JSON:
          {
            "recommended_action": "accept|repair|reject",
            "brief_rationale": "string"
          }

          {{strict_json_suffix}}

  critique:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.critique_bias}}
      {{fragments.system.no_markdown_json}}
    tasks:
      self_critique:
        description: "Top-K branch critique before final scoring."
        user: |
          Review the solution attempt carefully.

          Problem:
          {{problem_text}}

          Solution attempt:
          {{candidate_reasoning}}

          Candidate answer:
          {{candidate_answer}}

          Check:
          - invalid algebra or arithmetic
          - hidden assumptions
          - missing cases
          - contradiction with the original constraints
          - whether the answer line actually follows from the reasoning

          If a local correction is possible, provide the corrected answer.

          Schema:
          {{fragments.output_schemas.critique_json}}

          {{strict_json_suffix}}
      self_critique_text:
        description: "Textual critique variant for non-JSON postprocessing."
        user: |
          Check the following solution attempt carefully.
          Identify the first serious error if one exists.
          If a local fix is possible, state the corrected final answer.

          Problem:
          {{problem_text}}

          Solution attempt:
          {{candidate_reasoning}}

  repair:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.local_repair_bias}}
    tasks:
      local_repair:
        description: "Primary local repair prompt."
        user: |
          A solution branch failed and needs local repair.

          Problem:
          {{problem_text}}

          Current reasoning:
          {{candidate_reasoning}}

          Current answer:
          {{candidate_answer}}

          Failure classification:
          {{failure_type}}

          Failure notes:
          {{failure_notes}}

          Repair instructions:
          - preserve valid earlier steps when possible
          - fix only the broken substep, missing case, or invalid inference
          - do not restart with a completely unrelated approach unless the branch is unsalvageable
          - end with a single final answer

          {{fragments.reasoning.step_format_compact}}
          {{fragments.reasoning.answer_line_only}}
      symbolic_mismatch_repair:
        description: "Repair template when tool checks disagree."
        user: |
          The candidate branch conflicts with symbolic or brute-force validation.

          Problem:
          {{problem_text}}

          Candidate reasoning:
          {{candidate_reasoning}}

          Tool feedback:
          {{tool_feedback}}

          Repair the reasoning locally so that it agrees with the validated constraints if possible.
          If not repairable, state that the branch should be rejected.

          {{fragments.reasoning.step_format_compact}}
          {{fragments.reasoning.answer_line_only}}

  answering:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.final_integer_bias}}
    tasks:
      final_answer_only:
        description: "Strict final answer rendering."
        user: |
          Convert the candidate result into the final answer format only.

          Candidate result:
          {{candidate_answer}}

          Requirements:
          - output only the final answer
          - no explanation
          - no surrounding prose
      final_answer_json:
        description: "Structured final answer variant."
        user: |
          Convert the candidate result into the final answer JSON.

          Candidate result:
          {{candidate_answer}}

          Schema:
          {{fragments.output_schemas.answer_json}}

          {{strict_json_suffix}}
      submission_projection:
        description: "Projection to submission-safe answer string."
        user: |
          Normalize the candidate answer for submission.

          Candidate result:
          {{candidate_answer}}

          Requirements:
          - one answer only
          - no prose
          - preserve exact mathematical value if already canonical

  routing:
    system: |
      {{fragments.system.math_solver_core}}
      {{fragments.system.no_markdown_json}}
    tasks:
      archetype_prediction:
        description: "Optional prompt-driven archetype predictor."
        user: |
          Identify the most relevant reasoning archetypes for the problem below.

          Problem:
          {{problem_text}}

          Return JSON:
          {
            "archetypes": {
              "invariant": 0.0,
              "extremal": 0.0,
              "symmetry": 0.0,
              "pigeonhole": 0.0,
              "modular": 0.0,
              "generating_function": 0.0,
              "contradiction": 0.0,
              "construction": 0.0,
              "induction": 0.0,
              "bijection": 0.0,
              "case_split": 0.0,
              "brute_force_smallspace": 0.0
            },
            "brief_rationale": "string"
          }

          {{strict_json_suffix}}
      problem_type_prediction:
        description: "Optional prompt-driven problem type predictor."
        user: |
          Classify the problem.

          Problem:
          {{problem_text}}

          Return JSON:
          {
            "problem_type_probs": {
              "algebra": 0.0,
              "number_theory": 0.0,
              "geometry": 0.0,
              "combinatorics": 0.0,
              "mixed": 0.0
            }
          }

          {{strict_json_suffix}}
